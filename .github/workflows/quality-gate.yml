name: quality-gate

on:
  workflow_call:
    inputs:
      run_sonar:
        description: Run the local SonarQube scan on the selected runner
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: coverage + local Sonar quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Deterministic quality gates
        run: |
          cargo fmt --all -- --check
          git diff --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          mkdir -p target/quality
          cargo clippy --workspace --all-targets --locked --message-format=json -- -D warnings > target/quality/clippy.json
          cargo build --workspace --locked
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path target/quality/lcov.info --fail-under-lines 80
          test -s target/quality/lcov.info
          test -s target/quality/clippy.json
      - name: Upload Sonar reports
        uses: actions/upload-artifact@v4
        with:
          name: sonar-quality-reports
          path: target/quality
          if-no-files-found: error

  sonar:
    name: local SonarQube quality gate
    if: ${{ inputs.run_sonar }}
    needs: quality
    runs-on: [self-hosted, ridgecode-sonar]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sonar-quality-reports
          path: target/quality
      - name: Install SonarScanner
        run: npm install --global @sonar/scan@5.0.0
      - name: Require local Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node -e "if (!process.env.SONAR_TOKEN) process.exit(1)"
      - name: Local SonarQube scan and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NO_PROXY: localhost,127.0.0.1
        run: sonar-scanner-npm -Dsonar.host.url=http://localhost:9000 -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
