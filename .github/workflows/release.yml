# 跨平台发布:打 `v*` 标签(如 v0.1.0)即为五个目标构建 ridge 单二进制,
# 归档成 .tar.gz(类 Unix)/ .zip(Windows)并上传到对应 GitHub Release。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 构建 + 归档 + 上传到 Release 一步到位;非本机目标(如 aarch64-linux)自动用 cross。
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ridge
          target: ${{ matrix.target }}
          # 归档命名:ridge-<target>.tar.gz / .zip
          archive: ridge-$target
          tar: unix
          zip: windows
          # 一起打包进归档的附带文件(仓库暂无 LICENSE,加了再补进来)
          include: README.md
          # Cargo.lock 已入库,锁定依赖版本保证可复现
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
