# 跨平台发布:打 `v*` 标签(如 v0.1.0)即为五个目标构建 ridgecode 单二进制,
# 归档成 .tar.gz(类 Unix)/ .zip(Windows)并上传到对应 GitHub Release。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: release quality gate (local SonarQube)
    uses: ./.github/workflows/quality-gate.yml
    with:
      run_sonar: true
    secrets: inherit

  # 先建好 Release(幂等),再让矩阵各目标往里传产物 —— 根除「五 job 并发抢着创建 Release
  # 全落空、轮询 release not found 超时」的竞态(此前偶发全败,靠重跑碰运气)。
  create-release:
    name: create-release
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 构建 + 归档 + 上传到 Release 一步到位;非本机目标(如 aarch64-linux)自动用 cross。
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ridgecode
          target: ${{ matrix.target }}
          # 归档命名:ridgecode-<target>.tar.gz / .zip
          archive: ridgecode-$target
          tar: unix
          zip: windows
          # 每个归档附带 SHA256 校验和,便于校验下载完整性。
          checksum: sha256
          # 一起打包进归档的附带文件(README + 平台安装脚本;无 cargo 即可装到 PATH)
          include: README.md,scripts/install.sh,scripts/install.ps1
          # Cargo.lock 已入库,锁定依赖版本保证可复现
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
