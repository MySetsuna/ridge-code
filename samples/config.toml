# RidgeCode 配置样例 —— 复制到 ~/.ridge/config.toml(或用 RIDGE_CONFIG 指定路径)。
# env 变量覆盖此处;**密钥不进 config**,只走 RIDGE_API_KEY 环境变量。

provider  = "openai"                               # openai(兼容端点)| anthropic
model     = "glm-4.5-air"
base_url  = "https://open.bigmodel.cn/api/paas/v4" # OpenAI 兼容端点;anthropic 走 https://api.anthropic.com/v1
budget_tokens = 200000                             # 0 = 不限;超预算熔断停机
# skills_dir = "C:/Users/you/.ridge/skills"        # 不填默认 ~/.ridge/skills
# skip_danger = false                              # true = 工具自动放行不问 [y/N](灾难命令仍拦)

# 多个 MCP 服务器并接 —— 加一段就多一批工具,不改源码。
# [[mcp]]
# name = "notebooklm"
# cmd  = "notebooklm-mcp"

# 接结构化搜索 AnySearch(Windows 需 cmd /c 包一层,因 Rust 不解析 npx.cmd):
# [[mcp]]
# name = "anysearch"
# cmd  = "cmd"
# args = ["/c", "npx", "-y", "mcp-remote", "https://api.anysearch.com/mcp"]
