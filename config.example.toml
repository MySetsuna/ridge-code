# 复制到 ~/.ridge/config.toml 并填写。
# ⚠️ 模型必须支持工具调用(tool calling),避免纯推理型(如 *-r1)。
#
# 三种写法(自上而下优先):① [[providers]] 命名注册表 + [roles];
# ② [strong]+[weak];③ 单 [provider]。后两者为向后兼容。

# === 推荐:命名 provider 注册表 + 角色/路由(多供应商 / 多模型 / 原生 Anthropic)===
# 声明任意 N 个命名 provider,再由 [roles] 按名选强/弱;可选 [routing] 按难度把 worker
# 路由到任意命名模型(真正用上 >2 个模型)。取消下面注释即启用(会覆盖上面的 [strong]/[weak])。
#
# [[providers]]
# name = "claude"
# kind = "anthropic"                       # 原生 Anthropic Messages API(x-api-key + tool_use/tool_result)
# base_url = "https://api.anthropic.com/v1"
# model = "claude-sonnet-4-6"
# api_key_env = "ANTHROPIC_KEY"
# # max_tokens = 8192                       # 仅 anthropic 用(必填项),缺省 8192
#
# [[providers]]
# name = "deepseek"                         # kind 缺省 = openai(兼容端点)
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_KEY"
#
# [[providers]]
# name = "qwen"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# model = "qwen-plus"
# api_key_env = "QWEN_KEY"
#
# [roles]
# strong = "claude"                         # planner/reviewer/修复/基线 + 默认 hard worker
# weak   = "deepseek"                       # 默认 trivial/moderate worker
#
# [routing]                                 # 可选:按难度覆盖 worker 模型(用上第 3 个模型)
# hard     = "claude"
# moderate = "qwen"
# trivial  = "deepseek"

# === 兼容:强/弱双 provider(跨模型路由)===
# 难子任务/规划/修复/评审 → 强;其余 → 弱。两段可指向不同 provider 或不同模型。
[strong]
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.3-70b-instruct"
api_key_env = "RIDGE_API_KEY"            # 然后:export RIDGE_API_KEY=nvapi-xxxx(或放 .env.local)
# price_in = 0.5    # USD / 每百万 input tokens(eval 用于折算成本;不填则按 $0 计)
# price_out = 1.5   # USD / 每百万 output tokens

[weak]
base_url = "https://integrate.api.nvidia.com/v1"
model = "qwen/qwen3-next-80b-a3b-instruct"
api_key_env = "RIDGE_API_KEY"
# price_in = 0.5    # USD / 每百万 input tokens(eval 用于折算成本;不填则按 $0 计)
# price_out = 1.5   # USD / 每百万 output tokens

# === 兼容写法:单 provider(强=弱都用它)===
# [provider]
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api_key_env = "RIDGE_API_KEY"
# api_key = "..."                        # 或直接填(别提交进 git)

# 其它 OpenAI 兼容端点:
#   智谱 GLM:  https://open.bigmodel.cn/api/paas/v4
#   阿里 Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1
#   本地 Ollama: http://localhost:11434/v1

# === M4:外部 MCP 服务器(可选,子进程 stdio)===
# 声明后,启动时会连上这些服务器、把它们的工具接进 Worker 工具集,
# 工具名带命名空间前缀 <name>__<tool>(避免多服务器/与内置工具重名)。
# 单个服务器连不上会告警跳过,不影响用内置工具跑任务。
# ⚠️ Windows 下用 npx/uvx 这类需 shell 解析的命令可能报 ENOENT,
#    可改用绝对路径的可执行文件,或用 cmd /c 包裹。
#
# [[mcp]]
# name = "git"                                  # 命名空间前缀,需唯一
# command = "uvx"
# args = ["mcp-server-git"]
#
# [[mcp]]
# name = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# env = { EXAMPLE_TOKEN = "..." }               # 可选:附加环境变量
