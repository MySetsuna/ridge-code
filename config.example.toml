# 复制到 ~/.ridge/config.toml 并填写。
# ⚠️ 模型必须支持工具调用(tool calling),避免纯推理型(如 *-r1)。

# === M2:强/弱双 provider(跨模型路由,推荐)===
# 难子任务/规划/修复/评审 → 强;其余 → 弱。两段可指向不同 provider 或不同模型。
[strong]
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.3-70b-instruct"
api_key_env = "RIDGE_API_KEY"            # 然后:export RIDGE_API_KEY=nvapi-xxxx(或放 .env.local)

[weak]
base_url = "https://integrate.api.nvidia.com/v1"
model = "qwen/qwen3-next-80b-a3b-instruct"
api_key_env = "RIDGE_API_KEY"

# === 兼容写法:单 provider(强=弱都用它)===
# [provider]
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api_key_env = "RIDGE_API_KEY"
# api_key = "..."                        # 或直接填(别提交进 git)

