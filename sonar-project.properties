sonar.projectKey=ridge-code
sonar.host.url=http://localhost:9000
sonar.projectName=RidgeCode
sonar.sourceEncoding=UTF-8
sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=**/*tests.rs,**/tests/**
sonar.exclusions=target/**,dist/**,.iteration/**
sonar.rust.cargo.manifestPaths=crates/langgraph/Cargo.toml,crates/agent/Cargo.toml,crates/tools/Cargo.toml,crates/provider/Cargo.toml,crates/mcp/Cargo.toml,crates/eval/Cargo.toml
sonar.rust.lcov.reportPaths=target/quality/lcov.info
sonar.rust.clippy.reportPaths=target/quality/clippy.json
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
