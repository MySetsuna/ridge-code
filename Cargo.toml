[workspace]
resolver = "2"
members = ["crates/langgraph", "crates/agent", "crates/tools", "crates/provider", "crates/mcp", "crates/eval"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# 依赖版本统一在此管理,子 crate 用 `dep.workspace = true`。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
