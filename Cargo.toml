[workspace]
resolver = "2"
members = ["crates/langgraph", "crates/agent", "crates/tools", "crates/provider", "crates/mcp", "crates/eval"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

# 依赖版本统一在此管理,子 crate 用 `dep.workspace = true`。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# rustls-tls(非默认 native-tls):纯 Rust TLS,去掉 openssl 系统依赖 —— 全平台跨编无忧、二进制更可移植。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"

# 发布档:面向「独立分发的单二进制」优化 —— 更小、更快、去符号。
# 注意:**不设** panic = "abort" —— TUI 靠 `TerminalGuard` 的 Drop 在 panic 时恢复终端
# (退出 raw mode / 关 BPM / Pop CSI u),abort 会跳过 Drop 令终端卡死,故保留 unwind。
[profile.release]
lto = true            # 跨 crate 链接期优化,去死码
codegen-units = 1     # 单元编译,换更优代码(编译更慢,可接受)
strip = true          # 去调试符号,二进制更小
opt-level = 3         # 速度优先(TUI/网络场景不追极致体积)
