[workspace]
resolver = "2"
members = ["crates/langgraph", "crates/agent", "crates/tools", "crates/provider", "crates/mcp", "crates/eval"]

[workspace.package]
edition = "2021"
version = "0.5.18"
license = "MIT"

# 依赖版本统一在此管理,子 crate 用 `dep.workspace = true`。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "signal"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# rustls-tls(非默认 native-tls):纯 Rust TLS,去掉 openssl 系统依赖 —— 全平台跨编无忧、二进制更可移植。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "socks"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info", "unstable-widget-ref", "scrolling-regions"] }
crossterm = "0.28"
# 终端单元格宽度(wcwidth 口径):CJK/emoji 显示占 2 格,光标/折行按此精确落点。
# 非「内核精简铁律」所禁的外置计算能力,乃 TUI 显示层标准纯数据宽度表(ratatui 本就间接依赖)。
unicode-width = "0.2"
unicode-segmentation = "1.13"
# OAuth PKCE 用的基础安全原语(iter-43):SHA-256(S256 challenge,crypto 绝不手搓)+ OS 安全随机。
# 非「内核精简铁律」所指的外置可装能力(RAG/AST/tiktoken 那类走 MCP/SKILL);OAuth 是内核 auth 特性,无法做成 skill。
sha2 = "0.10"
getrandom = "0.2"

# 发布档:面向「独立分发的单二进制」优化 —— 更小、更快、去符号。
# 注意:**不设** panic = "abort" —— TUI 靠 `TerminalGuard` 的 Drop 在 panic 时恢复终端
# (退出 raw mode / 关 BPM / Pop CSI u),abort 会跳过 Drop 令终端卡死,故保留 unwind。
[profile.release]
lto = true            # 跨 crate 链接期优化,去死码
codegen-units = 1     # 单元编译,换更优代码(编译更慢,可接受)
strip = true          # 去调试符号,二进制更小
opt-level = 3         # 速度优先(TUI/网络场景不追极致体积)
